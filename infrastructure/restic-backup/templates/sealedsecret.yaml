# Restic repository password (repo was never initialised before 2026-10-25, so this is its first and permanent password).
# Plaintext: kubectl -n media get secret restic-plex-credentials -o jsonpath='{.data.RESTIC_PASSWORD}' | base64 -d
# -> keep a copy in Vaultwarden; without it the restic repo cannot be restored.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.restic.passwordSecretName }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    {{ .Values.restic.passwordSecretKey }}: 
  template:
    metadata:
      name: {{ .Values.restic.passwordSecretName }}
      namespace: {{ .Release.Namespace }}
