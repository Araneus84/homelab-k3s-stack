apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plex
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Araneus84/homelab-k3s-stack.git
    targetRevision: main
    path: apps/media/plex
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  # restic-backup scales plex to 0 nightly for a consistent DB copy; without this, selfHeal scaled it
  # straight back up mid-backup.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: plex
      jsonPointers:
        - /spec/replicas
